<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Annie's Little Corner project cover</title>
  <desc id="desc">A calm bilingual editorial library featuring Art, Science, and Literature cards.</desc>
  <rect width="1600" height="900" fill="#f6f0e5"/>
  <circle cx="1380" cy="120" r="220" fill="#dce3d7" opacity="0.85"/>
  <circle cx="170" cy="790" r="260" fill="#ead8c8" opacity="0.7"/>
  <text x="130" y="155" fill="#3f5144" font-family="Georgia, serif" font-size="40" letter-spacing="5">ANNIE'S</text>
  <text x="130" y="255" fill="#25382d" font-family="Georgia, serif" font-size="88" font-weight="700">Little Corner</text>
  <text x="134" y="315" fill="#6a766d" font-family="Arial, sans-serif" font-size="30">A calm place to learn something small every day</text>
  <text x="134" y="365" fill="#6a766d" font-family="Arial, sans-serif" font-size="26">每天学一点，也很好</text>
  <g transform="translate(130 455)">
    <rect width="390" height="255" rx="30" fill="#fffaf2" stroke="#b8c5b7" stroke-width="4"/>
    <circle cx="72" cy="73" r="34" fill="#b87e61"/>
    <text x="125" y="83" fill="#394a3e" font-family="Arial, sans-serif" font-size="31" font-weight="700">Art 艺术</text>
    <text x="45" y="150" fill="#6a766d" font-family="Georgia, serif" font-size="25">Look closely.</text>
    <text x="45" y="192" fill="#6a766d" font-family="Arial, sans-serif" font-size="22">Van Gogh · Hokusai</text>
  </g>
  <g transform="translate(605 455)">
    <rect width="390" height="255" rx="30" fill="#fffaf2" stroke="#b8c5b7" stroke-width="4"/>
    <circle cx="72" cy="73" r="34" fill="#6f8c7c"/>
    <text x="125" y="83" fill="#394a3e" font-family="Arial, sans-serif" font-size="31" font-weight="700">Science 科学</text>
    <text x="45" y="150" fill="#6a766d" font-family="Georgia, serif" font-size="25">Stay curious.</text>
    <text x="45" y="192" fill="#6a766d" font-family="Arial, sans-serif" font-size="22">Space · Nature · Ideas</text>
  </g>
  <g transform="translate(1080 455)">
    <rect width="390" height="255" rx="30" fill="#fffaf2" stroke="#b8c5b7" stroke-width="4"/>
    <circle cx="72" cy="73" r="34" fill="#9b8268"/>
    <text x="125" y="83" fill="#394a3e" font-family="Arial, sans-serif" font-size="31" font-weight="700">Literature 文学</text>
    <text x="45" y="150" fill="#6a766d" font-family="Georgia, serif" font-size="25">Read slowly.</text>
    <text x="45" y="192" fill="#6a766d" font-family="Arial, sans-serif" font-size="22">Stories · Poems · Classics</text>
  </g>
</svg>
